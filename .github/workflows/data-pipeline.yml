name: Data Pipeline

on:
  schedule:
    # Source cadence: DSS publishes the payment demographics QUARTERLY (Mar/Jun/Sep/Dec
    # reference quarters, released ~2 months later). Cron is therefore quarterly, in the
    # month after each release lands, on a staggered day/minute so fleet repos don't
    # all fire together. Never faster — the underlying data does not change in between.
    - cron: '17 6 9 2,5,8,11 *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['pipeline/**']

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # npm install, not npm ci: mapshaper pulls a wildcard @types/node, so a
      # freshly generated lockfile still fails `npm ci` with EUSAGE. This installs
      # a build tool for the data step, not the shipped bundle — the deploy
      # workflow still uses `npm ci` at the root, where reproducibility matters.
      - run: npm install --no-audit --no-fund
        working-directory: pipeline
      - run: node pipeline/collect.mjs
      - run: node pipeline/aggregate.mjs
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/
          git diff --cached --quiet || git commit -m "Update data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push || (git pull --rebase && git push)
